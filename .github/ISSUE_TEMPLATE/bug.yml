name: Signaler un bug
description: Un comportement incorrect ou un plantage.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que s'est-il passé ? Qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Rapport de diagnostics
      description: Aide > Diagnostics… > Copier le rapport.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Extrait du journal
      description: Aide > Ouvrir le dossier des logs (fichier lsfcars.log).
      render: text
