name: Proposer une fonctionnalité
description: Une idée d'amélioration pour LeStitcheurFou Cars.
labels: [amélioration]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Quel problème cette fonctionnalité résout-elle ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Comment imaginez-vous la solution ?
  - type: dropdown
    id: area
    attributes:
      label: Domaine
      options:
        - Atelier 3D
        - Livrées
        - LSPD / EMS
        - Génération IA
        - Export FiveM
        - Gestion de projets
        - Autre
