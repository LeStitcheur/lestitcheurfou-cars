name: Build Windows

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: LeStitcheurFouCars.exe
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import lsfcars; print(lsfcars.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $version"

      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("v${{ steps.version.outputs.version }}" -ne "${{ github.ref_name }}") {
            throw "Le tag ${{ github.ref_name }} ne correspond pas à la version v${{ steps.version.outputs.version }}"
          }

      - name: Construire et tester l'exécutable
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SoftwareGL

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeStitcheurFouCars-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/LeStitcheurFouCars.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le tag est sur main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Les releases sont publiées uniquement depuis main."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: LeStitcheurFouCars-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Extraire les notes du CHANGELOG
        run: |
          version="${{ needs.build.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Version $version" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: LeStitcheurFou Cars ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/LeStitcheurFouCars.exe
