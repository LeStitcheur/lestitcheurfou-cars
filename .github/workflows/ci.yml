name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests Windows (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      # Pas de GPU sur les runners : rendu OpenGL logiciel embarqué par Qt.
      LSFCARS_SOFTWARE_GL: "1"
      # Les tests de rendu doivent réellement s'exécuter (échec au lieu d'être ignorés).
      LSFCARS_REQUIRE_GL: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lancer les tests
        run: pytest -ra --junitxml=pytest-report.xml
      - name: Test de démarrage (application complète, rendu logiciel)
        if: matrix.python == '3.12'
        # Code de sortie : 0 = tout fonctionne ; 3 à 9 = module en échec (voir lsfcars/app.py).
        run: python -m lsfcars --smoke-test 1500
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-py${{ matrix.python }}
          path: pytest-report.xml
          retention-days: 14
